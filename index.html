<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>門市叫貨系統</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#23262f; --ink-2:#4a4f5e; --ink-3:#7a7f8d;
  --paper:#f3eee1; --card:#fffdf7; --line:#e4dcc8;
  --red:#c8322e; --red-d:#a32623; --red-soft:#f7e4e1;
  --green:#3f7d52; --green-soft:#e7efe8; --green-line:#c9dccd;
  --gold:#b98a4e; --shadow:0 12px 32px rgba(35,38,47,.12);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.55;
}
.serif{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

/* ===== App bar ===== */
.appbar{
  position:sticky;top:0;z-index:40;background:var(--ink);color:#f5f1e6;
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 2px 0 rgba(0,0,0,.08);
}
.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;letter-spacing:.5px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(200,50,46,.35)}
.clock{text-align:right;line-height:1.3}
.clock #clockDate{display:block;font-size:12px;color:#cfc9b8}
.clock #clockTime{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff}

/* ===== Screens ===== */
.screen{display:none;max-width:680px;margin:0 auto;padding:20px 16px 120px}
.screen.active{display:block}
.screen.slim{padding-bottom:40px}

/* ===== Home ===== */
.hero{padding:26px 4px 22px}
.hero .eyebrow{font-size:12px;letter-spacing:3px;color:var(--gold);font-weight:700}
.hero h1{font-size:34px;line-height:1.2;margin:8px 0 6px;letter-spacing:1px}
.hero p{color:var(--ink-2);font-size:15px}
.store-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:8px}
@media(min-width:560px){.store-grid{grid-template-columns:repeat(3,1fr)}}
.store-card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 16px 14px;text-align:left;transition:transform .15s ease,box-shadow .15s ease;
  box-shadow:0 2px 6px rgba(35,38,47,.05);overflow:hidden;
}
.store-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.store-card:active{transform:scale(.97)}
.store-num{
  position:absolute;top:0;right:0;background:var(--red);color:#fff;font-size:11px;font-weight:700;
  padding:3px 10px;border-radius:0 var(--radius) 0 10px;letter-spacing:1px;
}
.store-name{display:block;font-size:26px;font-weight:700;margin:6px 0 10px;letter-spacing:2px}
.store-status{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px}
.st-new{background:var(--paper);color:var(--ink-3)}
.st-ok{background:var(--green-soft);color:var(--green);font-weight:700}
.home-foot{margin-top:26px;text-align:center;color:var(--ink-3);font-size:12px}
.link-btn{color:var(--red);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* ===== Order ===== */
.subbar{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.subbar .back{
  display:flex;align-items:center;gap:4px;font-size:14px;color:var(--ink-2);
  padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:600;
}
.subbar .back:hover{color:var(--red);border-color:var(--red)}
.subbar h2{font-size:22px;font-weight:700;flex:1;letter-spacing:1px}
.searchbox{position:sticky;top:58px;z-index:30;margin-bottom:14px}
.searchbox input{
  width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);
  font-size:15px;outline:none;transition:border-color .15s;
}
.searchbox input:focus{border-color:var(--red)}
.searchbox .hint{font-size:12px;color:var(--ink-3);margin:6px 2px 0}
.cats{position:sticky;top:134px;z-index:29;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-chip{flex:none;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.cat-chip:hover{border-color:var(--gold)}
.cat-chip.active{background:var(--red);border-color:var(--red);color:#fff}
.cat-chip .cnt{font-size:11px;opacity:.75;margin-left:3px}
.cat-head{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;padding-top:6px;border-top:1px dashed var(--line)}
.cat-head .tag{background:var(--ink);color:#fff;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:6px;letter-spacing:1px}
.cat-head .sub{font-size:12px;color:var(--ink-3)}
.item-list{display:flex;flex-direction:column;gap:8px}
.item-row{
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;cursor:pointer;transition:all .15s;user-select:none;
}
.item-row:hover{border-color:var(--gold)}
.item-row.on{background:var(--green-soft);border-color:var(--green-line)}
.checkmark{
  width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;
  flex:none;transition:all .15s;
}
.item-row.on .checkmark{background:var(--green);border-color:var(--green)}
.item-code{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none;min-width:52px}
.item-name{font-size:14.5px;flex:1}
.qty-mini{display:flex;align-items:center;gap:2px;flex:none}
.qty-mini button{
  width:26px;height:26px;border-radius:7px;background:var(--card);border:1px solid var(--line);
  font-size:15px;font-weight:700;color:var(--ink);line-height:1;
}
.qty-mini button:active{background:var(--red);color:#fff;border-color:var(--red)}
.qty-mini b{min-width:26px;text-align:center;font-size:15px}
.empty{text-align:center;color:var(--ink-3);padding:44px 0;font-size:14px}

/* Sticky action bar */
.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(255,253,247,.92);
  backdrop-filter:blur(8px);border-top:1px solid var(--line);
}
.actionbar .inner{max-width:680px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
.actionbar .count{font-size:14px;color:var(--ink-2);flex:1}
.actionbar .count b{color:var(--red);font-size:18px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 20px;border-radius:12px;font-size:15px;font-weight:700;transition:all .15s;
}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:var(--red-d)}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--red);color:var(--red)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{filter:brightness(.95)}

/* Floating add button */
.fab{
  position:fixed;right:20px;bottom:86px;z-index:36;width:56px;height:56px;border-radius:50%;
  background:var(--ink);color:#fff;font-size:24px;font-weight:700;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;transition:transform .15s;
}
.fab:hover{transform:scale(1.08)}
.fab:active{transform:scale(.94)}

/* ===== Review ===== */
.summary{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 16px;
}
.sum-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:center}
.sum-card .v{font-size:30px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
.sum-card .l{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.rv-list{display:flex;flex-direction:column;gap:8px}
.rv-row{
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;
}
.rv-info{flex:1;min-width:0}
.rv-info .item-name{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty-stepper{display:flex;align-items:center;gap:2px;flex:none}
.qty-stepper button{
  width:30px;height:30px;border-radius:8px;background:var(--paper);border:1px solid var(--line);
  font-size:17px;font-weight:700;line-height:1;
}
.qty-stepper button:active{background:var(--red);color:#fff;border-color:var(--red)}
.qty-stepper b{min-width:30px;text-align:center;font-size:16px}
.review-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.review-actions .btn{width:100%;padding:14px;font-size:16px}

/* ===== Modal ===== */
.modal-back{
  position:fixed;inset:0;z-index:60;background:rgba(35,38,47,.5);display:none;
  align-items:flex-end;justify-content:center;
}
.modal-back.open{display:flex}
.modal{
  background:var(--card);width:100%;max-width:680px;max-height:88vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  animation:slideup .22s ease;
}
@keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:20px;font-weight:700;margin-bottom:14px;letter-spacing:.5px}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{
  padding:9px 14px;font-size:14px;font-weight:700;color:var(--ink-3);border-radius:10px 10px 0 0;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab.active{color:var(--red);border-bottom-color:var(--red)}
.tab-pane{display:none}
.tab-pane.active{display:block}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.field input{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;outline:none;
}
.field input:focus{border-color:var(--red)}
.form-actions{display:flex;gap:10px;margin-top:4px}
.form-actions .btn{flex:1}
.custom-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.custom-row{
  display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;
}
.custom-row .info{flex:1;min-width:0}
.custom-row .info .c{font-size:11.5px;color:var(--ink-3)}
.custom-row .info .n{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del-btn{color:var(--red);font-size:12.5px;font-weight:700;padding:6px 10px;border:1px solid var(--red);border-radius:8px}
.del-btn:hover{background:var(--red);color:#fff}
.import-hint{font-size:12.5px;color:var(--ink-3);margin:8px 0 12px}
.import-box{
  border:1.5px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;margin-bottom:12px;
}
.import-box .t{font-size:14px;font-weight:700;margin-bottom:4px}
.import-box .s{font-size:12px;color:var(--ink-3);margin-bottom:12px}
.file-label{
  display:inline-block;background:var(--red);color:#fff;padding:10px 18px;border-radius:10px;
  font-size:14px;font-weight:700;
}
.file-label:hover{background:var(--red-d)}
#fileInput{display:none}
.imported-count{font-size:13px;color:var(--green);font-weight:700;margin-top:8px}
</style>
</head>
<body>

<div class="appbar">
  <div class="brand"><span class="dot"></span><span class="serif">門市叫貨系統</span></div>
  <div class="clock">
    <span id="clockDate">--</span>
    <span id="clockTime">--:--:--</span>
  </div>
</div>

<!-- 主頁 -->
<div id="screen-home" class="screen slim">
  <div class="hero">
    <div class="eyebrow">RETAIL ORDERING</div>
    <h1 class="serif">門市叫貨</h1>
    <p>請選擇您的門市，開始勾選叫貨品項。</p>
  </div>
  <div class="store-grid" id="storeGrid"></div>
  <div class="home-foot">
    品項清單可隨時更新：<button class="link-btn" onclick="openManage()">品項管理（新增／匯入Excel）</button><br>
    資料儲存在目前瀏覽器，換裝置不會同步。
  </div>
</div>

<!-- 叫貨 -->
<div id="screen-order" class="screen">
  <div class="subbar">
    <button class="back" onclick="goHome()">← 回主頁</button>
    <h2 id="orderStoreName" class="serif"></h2>
  </div>
  <div class="searchbox">
    <input id="searchInput" type="search" placeholder="搜尋品項名稱或編號…" oninput="onSearch(this.value)">
    <div class="hint">可輸入品項名稱關鍵字或編號（如「小泡芙」或「35619」）</div>
  </div>
  <div class="cats" id="catBar"></div>
  <div class="item-list" id="itemList"></div>
</div>

<!-- 確認 -->
<div id="screen-review" class="screen">
  <div class="subbar">
    <button class="back" onclick="goOrder()">← 回叫貨</button>
    <h2 id="reviewStoreName" class="serif"></h2>
    <button class="back" onclick="goHome()">回主頁</button>
  </div>
  <div class="summary">
    <div class="sum-card"><div class="v" id="sumItems">0</div><div class="l">總品項數</div></div>
    <div class="sum-card"><div class="v" id="sumQty">0</div><div class="l">總數量</div></div>
  </div>
  <div class="rv-list" id="reviewList"></div>
  <div class="review-actions">
    <button class="btn btn-green" onclick="exportExcel()">⬇ 匯出品項 Excel 總表</button>
    <button class="btn btn-ghost" onclick="goHome()">回主頁</button>
    <button class="btn btn-ghost" onclick="clearCart()">清除叫貨</button>
  </div>
</div>

<!-- 品項管理 Modal -->
<div class="modal-back" id="manageModal" onclick="if(event.target===this)closeManage()">
  <div class="modal">
    <h3>品項管理</h3>
    <div class="tabs">
      <button class="tab active" data-tab="tab-add" onclick="switchTab(this)">新增品項</button>
      <button class="tab" data-tab="tab-import" onclick="switchTab(this)">匯入品項Excel</button>
      <button class="tab" data-tab="tab-custom" onclick="switchTab(this)">自訂品項</button>
    </div>

    <div class="tab-pane active" id="tab-add">
      <div class="field"><label>品項編碼</label><input id="newCode" placeholder="例如 35619"></div>
      <div class="field"><label>品項名稱［規格］</label><input id="newName" placeholder="例如 義美小泡芙 巧克力57G/包"></div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="addItem()">＋ 新增品項</button>
      </div>
    </div>

    <div class="tab-pane" id="tab-import">
      <div class="import-hint">上傳您的品項 Excel（第一欄＝品項編碼，第二欄＝品項名稱），匯入後會<strong>取代</strong>目前的品項清單。</div>
      <div class="import-box">
        <div class="t">選擇品項 Excel 檔案</div>
        <div class="s">支援 .xlsx / .xls / .csv</div>
        <label class="file-label" for="fileInput">選擇檔案</label>
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" onchange="importExcel(this.files[0])">
        <div class="imported-count" id="importMsg"></div>
      </div>
      <button class="btn btn-ghost" style="width:100%" onclick="resetItems()">回復內建預製品項</button>
    </div>

    <div class="tab-pane" id="tab-custom">
      <div class="import-hint">以下為您手動新增的品項，可隨時刪除。</div>
      <div class="custom-list" id="customList"></div>
    </div>
  </div>
</div>

<button class="fab" id="fabBtn" onclick="openManage()" style="display:none" title="增加品項">＋</button>
<div class="actionbar" id="actionbar" style="display:none">
  <div class="inner">
    <div class="count">已勾選 <b id="barCount">0</b> 項</div>
    <button class="btn btn-primary" onclick="goReview()">確認叫貨 →</button>
  </div>
</div>

const STORES = ["虎尾","北港","嘉義","高雄","潭子","豐原","屏東"];
const LS_ITEMS="ims_items_v1", LS_CUSTOM="ims_custom_v1", LS_CART="ims_cart_v1_", LS_CUR="ims_cur_v1";

let items=[], customFlags={}, currentStore="", cart={}, searchText="", activeCat="全部";

function categorize(name){
  const n = name || '';
  if(n.includes('小泡芙')) return '小泡芙';
  if(n.includes('蛋捲')) return '蛋捲';
  if(n.includes('夾心酥')) return '夾心酥';
  if(n.includes('法蘭酥')) return '法蘭酥';
  if(n.includes('薄餅')) return '薄餅';
  if(n.includes('威化捲')) return '威化捲';
  if(/軟糖|QQ糖|牛奶糖/.test(n)) return '軟糖/QQ糖';
  if(n.includes('煎餅')) return '煎餅';
  if(/蘇打|蘇打/.test(n)) return '蘇打餅';
  if(n.includes('消化餅')) return '消化餅';
  if(n.includes('養生')) return '養生餅';
  if(n.includes('千層派')) return '千層派';
  if(n.includes('巧克力酥片')) return '巧克力酥片';
  if(n.includes('青豆')) return '青豆';
  if(n.includes('果凍')) return '果凍';
  if(n.includes('營養餅')) return '營養餅';
  return '其他';
}
function normalizeItems(){
  items.forEach(it=>{ if(!it.category) it.category = categorize(it.name); });
}

function loadState(){
  try{ items = JSON.parse(localStorage.getItem(LS_ITEMS)) || []; }catch(e){ items=[]; }
  if(!Array.isArray(items) || !items.length) items = DEFAULT_ITEMS.slice();
  normalizeItems(); saveItems();
  try{ customFlags = JSON.parse(localStorage.getItem(LS_CUSTOM)) || {}; }catch(e){ customFlags={}; }
  currentStore = localStorage.getItem(LS_CUR) || "";
  loadCart();
}
function saveItems(){ localStorage.setItem(LS_ITEMS, JSON.stringify(items)); }
function saveCustom(){ localStorage.setItem(LS_CUSTOM, JSON.stringify(customFlags)); }
function loadCart(){ try{ cart = JSON.parse(localStorage.getItem(LS_CART+currentStore)) || {}; }catch(e){ cart={}; } }
function saveCart(){ localStorage.setItem(LS_CART+currentStore, JSON.stringify(cart)); }

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  const isOrder = id==='screen-order';
  document.getElementById('actionbar').style.display = isOrder ? 'block' : 'none';
  document.getElementById('fabBtn').style.display = isOrder ? 'flex' : 'none';
}

/* ================= 主頁 ================= */
function renderHome(){
  const grid = document.getElementById('storeGrid');
  grid.innerHTML = STORES.map((s,i)=>{
    let n=0; try{ n=Object.keys(JSON.parse(localStorage.getItem(LS_CART+s)||'{}')).length; }catch(e){}
    const status = n>0 ? `<span class="st-ok">已叫貨 ${n} 項</span>` : `<span class="st-new">尚未叫貨</span>`;
    return `<button class="store-card" onclick="selectStore('${s}')">
      <span class="store-num">${String(i+1).padStart(2,'0')}</span>
      <span class="store-name serif">${s}</span>
      <span class="store-status">${status}</span>
    </button>`;
  }).join('');
}
function selectStore(name){
  currentStore = name;
  localStorage.setItem(LS_CUR, name);
  loadCart();
  renderOrder();
  show('screen-order');
}

/* ================= 叫貨 ================= */
function onSearch(v){ searchText=v; renderOrder(); }
function renderCats(){
  const counts = {};
  items.forEach(it=>{ counts[it.category] = (counts[it.category]||0)+1; });
  const cats = Object.keys(counts).sort();
  const bar = document.getElementById('catBar');
  bar.innerHTML = ['全部'].concat(cats).map(c=>{
    const n = c==='全部' ? items.length : counts[c];
    return `<button class="cat-chip ${activeCat===c?'active':''}" onclick="setCat('${c}')">${c}<span class="cnt">${n}</span></button>`;
  }).join('');
}
function setCat(c){ activeCat = c; renderOrder(); }
function itemRowHTML(it){
  const ck = cart[it.code];
  return `<div class="item-row ${ck?'on':''}" role="button" tabindex="0"
    onclick="toggleItem('${it.code}')"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleItem('${it.code}')}">
    <span class="checkmark">${ck?'✓':''}</span>
    <span class="item-code">${it.code}</span>
    <span class="item-name">${it.name}</span>
    ${ck?`<span class="qty-mini" onclick="event.stopPropagation()">
      <button onclick="qty('${it.code}',-1)">−</button><b>${ck.qty}</b><button onclick="qty('${it.code}',1)">+</button>
    </span>`:''}
  </div>`;
}
function renderOrder(){
  document.getElementById('orderStoreName').textContent = currentStore;
  renderCats();
  const kw = searchText.trim().toLowerCase();
  const list = document.getElementById('itemList');
  let rows = items.filter(it => !kw || it.code.toLowerCase().includes(kw) || it.name.toLowerCase().includes(kw));
  if(!rows.length){
    list.innerHTML = `<div class="empty">${kw ? '找不到符合「'+searchText+'」的品項' : '目前沒有品項，請先匯入品項 Excel 或新增品項'}</div>`;
    updateBar(); return;
  }
  if(kw){
    list.innerHTML = rows.map(itemRowHTML).join('');
  } else if(activeCat === '全部'){
    const byCat = {};
    rows.forEach(it=>{ (byCat[it.category]=byCat[it.category]||[]).push(it); });
    list.innerHTML = Object.keys(byCat).sort().map(c=>{
      const checked = byCat[c].filter(it=>cart[it.code]).length;
      return `<div class="cat-head">
        <span class="tag">${c}</span>
        <span class="sub">${byCat[c].length} 項${checked ? ` ・ 已勾選 ${checked}` : ''}</span>
      </div>` + byCat[c].map(itemRowHTML).join('');
    }).join('');
  } else {
    rows = rows.filter(it=>it.category===activeCat);
    list.innerHTML = rows.length ? rows.map(itemRowHTML).join('') : `<div class="empty">此分類尚無品項</div>`;
  }
  updateBar();
}
function toggleItem(code){
  if(cart[code]){ delete cart[code]; }
  else {
    const it = items.find(i=>i.code===code);
    cart[code] = {code:code, name: it ? it.name : code, qty:1};
  }
  saveCart(); renderOrder();
}
function qty(code, d){
  if(!cart[code]) return;
  cart[code].qty = Math.max(1, cart[code].qty + d);
  saveCart();
  const active = document.querySelector('.screen.active');
  if(active.id==='screen-review') renderReview(); else renderOrder();
}
function updateBar(){
  const n = Object.keys(cart).length;
  document.getElementById('barCount').textContent = n;
}

/* ================= 確認 ================= */
function goReview(){
  if(!Object.keys(cart).length){ alert('尚未勾選任何品項。'); return; }
  renderReview(); show('screen-review');
}
function renderReview(){
  document.getElementById('reviewStoreName').textContent = currentStore;
  const keys = Object.keys(cart);
  const list = document.getElementById('reviewList');
  if(!keys.length){
    list.innerHTML = `<div class="empty">尚未勾選任何品項</div>`;
  } else {
    list.innerHTML = keys.map(code=>{
      const it = cart[code];
      return `<div class="rv-row">
        <div class="rv-info"><span class="item-code">${it.code}</span><span class="item-name">${it.name}</span></div>
        <div class="qty-stepper">
          <button onclick="qty('${code}',-1)">−</button><b>${it.qty}</b><button onclick="qty('${code}',1)">+</button>
        </div>
      </div>`;
    }).join('');
  }
  document.getElementById('sumItems').textContent = keys.length;
  document.getElementById('sumQty').textContent = keys.reduce((a,c)=>a+cart[c].qty,0);
}
function clearCart(){
  if(!Object.keys(cart).length) return;
  if(!confirm(`確定清除「${currentStore}」門市的叫貨清單？`)) return;
  cart={}; saveCart(); renderReview(); renderHome();
}

/* ================= 導覽 ================= */
function goHome(){ renderHome(); show('screen-home'); }
function goOrder(){ renderOrder(); show('screen-order'); }

/* ================= 品項管理 ================= */
function openManage(){
  renderCustomList();
  document.getElementById('manageModal').classList.add('open');
}
function closeManage(){ document.getElementById('manageModal').classList.remove('open'); }
function switchTab(btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(btn.dataset.tab).classList.add('active');
}
function addItem(){
  const code = document.getElementById('newCode').value.trim();
  const name = document.getElementById('newName').value.trim();
  if(!code || !name){ alert('請輸入品項編碼與名稱。'); return; }
  if(items.some(i=>i.code===code)){ alert('此品項編碼已存在。'); return; }
  items.push({code:code, name:name, category:categorize(name)});
  customFlags[code] = true;
  saveItems(); saveCustom();
  renderCustomList(); renderOrder();
  document.getElementById('newCode').value='';
  document.getElementById('newName').value='';
  alert(`已新增品項：${code} ${name}`);
}
function delItem(code){
  if(!confirm(`確定刪除品項 ${code}？`)) return;
  items = items.filter(i=>i.code!==code);
  delete customFlags[code];
  delete cart[code];
  saveItems(); saveCustom(); saveCart();
  renderCustomList(); renderOrder();
}
function renderCustomList(){
  const custom = items.filter(i=>customFlags[i.code]);
  const el = document.getElementById('customList');
  if(!custom.length){
    el.innerHTML = `<div class="empty">尚無手動新增的品項</div>`;
  } else {
    el.innerHTML = custom.map(it=>`
      <div class="custom-row">
        <div class="info"><span class="c">${it.code}</span><span class="n">${it.name}</span></div>
        <button class="del-btn" onclick="delItem('${it.code}')">刪除</button>
      </div>`).join('');
  }
}
function importExcel(file){
  if(typeof XLSX==='undefined'){ alert('Excel 功能需連網載入，請確認網路連線後再試。'); return; }
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      const out = [];
      for(const r of rows){
        const c = String(r[0]||'').trim();
        const n = String(r[1]||'').trim();
        if(!n) continue;
        if(/品項|編碼|編號/.test(c) && /品項|名稱|規格/.test(n)) continue;
        out.push({code:c, name:n, category:categorize(n)});
      }
      if(!out.length){ alert('無法從檔案讀出品項，請確認格式（第一欄編碼、第二欄名稱）。'); return; }
      if(!confirm(`將以檔案內容取代目前品項清單（共 ${out.length} 項），確定？`)) return;
      items = out; customFlags = {};
      saveItems(); saveCustom();
      renderCustomList(); renderOrder();
      document.getElementById('importMsg').textContent = `✓ 已匯入 ${out.length} 項品項`;
      alert(`已匯入 ${out.length} 項品項。`);
    }catch(err){
      alert('匯入失敗：'+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}
function resetItems(){
  if(!confirm('回復為內建預設品項清單？')) return;
  items = DEFAULT_ITEMS.slice(); customFlags = {};
  normalizeItems();
  saveItems(); saveCustom();
  renderCustomList(); renderOrder();
  alert('已回復內建預製品項。');
}

/* ================= 匯出 Excel ================= */
function exportExcel(){
  if(typeof XLSX==='undefined'){ alert('Excel 功能需連網載入，請確認網路連線後再試。'); return; }
  const keys = Object.keys(cart);
  if(!keys.length){ alert('尚未勾選任何品項，無法匯出。'); return; }
  const now = new Date();
  const dateStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
  const week = ['日','一','二','三','四','五','六'][now.getDay()];
  const aoa = [];
  aoa.push(['門市叫貨單', '', '']);
  aoa.push(['門市', currentStore, '']);
  aoa.push(['日期', `${dateStr}（週${week}）`, '']);
  aoa.push(['品項編碼','品項名稱[規格]','數量']);
  keys.forEach(c=>{ const it=cart[c]; aoa.push([it.code, it.name, it.qty]); });
  aoa.push([]);
  aoa.push(['總品項數', keys.length, '']);
  aoa.push(['總數量', keys.reduce((a,c)=>a+cart[c].qty,0), '']);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:14},{wch:48},{wch:10}];
  ws['!merges'] = [{s:{r:0,c:0},e:{r:0,c:2}}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '叫貨單');
  const d = new Date();
  const ds = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  XLSX.writeFile(wb, `叫貨單-${currentStore}-${ds}.xlsx`);
}

/* ================= 啟動 ================= */
function pad(n){ return String(n).padStart(2,'0'); }
function tickClock(){
  const d = new Date();
  const week = ['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('clockDate').textContent = `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} 週${week}`;
  document.getElementById('clockTime').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
loadState();
renderHome();
show('screen-home');
tickClock();
setInterval(tickClock, 1000);
